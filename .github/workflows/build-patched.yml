name: Build Patched NekoBox

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Env-based git config is read even inside the temporary HOME that actions/checkout
      # installs for its own global config, so this silences the
      # "Using 'master' as the name for the initial branch" hint block.
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
      GIT_CONFIG_KEY_1: advice.defaultBranchName
      GIT_CONFIG_VALUE_1: 'false'

    steps:
      - name: Checkout current repository (with patches)
        uses: actions/checkout@v5
        with:
          path: repo

      - name: Checkout NekoBoxForAndroid
        uses: actions/checkout@v5
        with:
          repository: starifly/NekoBoxForAndroid
          ref: 5bb4786de6864c039a889f71db54cc914ce46e15
          path: NekoBoxForAndroid
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # libcore/init.sh forces GOTOOLCHAIN=go1.27.1; match it here so Go does not self-download.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          # Listing go.mod as well changes the cache key, which forces the module cache
          # to be (re)populated instead of restoring the empty entry saved earlier.
          cache-dependency-path: |-
            NekoBoxForAndroid/libcore/go.mod
            NekoBoxForAndroid/libcore/go.sum

      - name: Setup Android NDK
        run: |
          # Keep GOMODCACHE in setup-go's path so the cache post-step finds it.
          echo "GOMODCACHE=/home/runner/go/pkg/mod" >> $GITHUB_ENV
          echo "GOCACHE=/home/runner/.cache/go-build" >> $GITHUB_ENV

          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" "platforms;android-35"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> $GITHUB_ENV
          echo "NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Setup Rust Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Apply Patches & Setup Sibling Repositories
        run: |
          # Patches in this repo intentionally carry trailing whitespace.
          git config --global apply.whitespace nowarn

          # 1. Apply patch to NekoBoxForAndroid, then the follow-up warning fixes
          #    (patches/kotlin-warnings.patch: Kotlin/javac diagnostics, Jetifier).
          cd NekoBoxForAndroid
          git apply ../repo/patches/NekoBoxForAndroid.patch
          git apply ../repo/patches/kotlin-warnings.patch
          git apply ../repo/patches/xray-integration.patch

          # Third-party warning fixes for byedpi (see patches/byedpi-warnings.patch).
          cat ../repo/patches/byedpi-warnings.patch >> patches/byedpi/0001-byedpi-jni-api.patch

          sed -i 's|{sing-box-repo-here}|https://github.com/starifly/sing-box.git|g' buildScript/lib/core/get_source.sh
          sed -i 's|{sing-vmess-repo-here}|https://github.com/starifly/sing-vmess.git|g' buildScript/lib/core/get_source.sh
          sed -i 's|{libneko-repo-here}|https://github.com/starifly/libneko.git|g' buildScript/lib/core/get_source.sh

          # The patch's pinned SHAs do not exist in the public forks; use the commits we verified.
          cat > buildScript/lib/core/get_source_env.sh <<'EOF'
          export COMMIT_SING_BOX="7054cac5124465ffdb145870d7c01885566711b1"
          export COMMIT_SING_VMESS="887f058c04c5b86d88188acc32093d0d62f53b6c"
          export COMMIT_LIBNEKO="6a85c185d62435a5293ef70ac3b638ae3ee1efa7"
          export COMMIT_BYEDPI="ba532298de7b28cfe854aea83d061369d13ca290"
          EOF

          # 3. (Xray) Download prebuilt Xray-core binaries (only arm64-v8a and x86_64 are published).
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/x86_64
          ( cd app/src/main/jniLibs/arm64-v8a && \
            curl -sL https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-android-arm64-v8a.zip -o x.zip && \
            unzip -o x.zip xray && mv xray libxray.so && rm x.zip )
          ( cd app/src/main/jniLibs/x86_64 && \
            curl -sL https://github.com/XTLS/Xray-core/releases/download/v26.10.31/Xray-android-amd64.zip -o x.zip && \
            unzip -o x.zip xray && mv xray libxray.so && rm x.zip )

          cd ..

          # 2. Clone sibling repos and apply patches (subshells so a failure never leaves us in the wrong dir)
          (
            git clone https://github.com/starifly/libneko libneko
            cd libneko
            git fetch origin 6a85c185d62435a5293ef70ac3b638ae3ee1efa7
            git checkout FETCH_HEAD
            git apply ../repo/patches/libneko.patch
          )

          (
            git clone https://github.com/masterking32/MasterDnsVPN MasterDnsVPN-plus
            cd MasterDnsVPN-plus
            git fetch origin 7de2476f1c33e69eec35360c52810dab43c5c986
            git checkout FETCH_HEAD
            git apply ../repo/patches/MasterDnsVPN.patch
          )

          (
            git clone https://github.com/starifly/sing-box sing-box
            cd sing-box
            git fetch origin 7054cac5124465ffdb145870d7c01885566711b1
            git checkout FETCH_HEAD
            # The fork carries no upstream tags, so `git describe` fails and the core
            # version becomes "unknown". Pull tags from upstream to resolve it.
            git fetch --tags https://github.com/SagerNet/sing-box
            git apply ../repo/patches/sing-box.patch
          )

          (
            git clone https://github.com/starifly/sing-vmess sing-vmess
            cd sing-vmess
            git fetch origin 887f058c04c5b86d88188acc32093d0d62f53b6c
            git checkout FETCH_HEAD
            git apply ../repo/patches/sing-vmess.patch
          )

          # sing-box go.mod replaces these; patches live in sing-box/patches
          (
            git clone --branch v3.1.20260814 https://github.com/amnezia-vpn/amneziawg-go amneziawg-go
            cd amneziawg-go
            for p in ../sing-box/patches/amneziawg-go/*.patch; do
              git apply "$p"
            done
          )

          (
            git clone https://github.com/metacubex/utls utls
            cd utls
            git fetch origin f7d52c22f3a8d2f510ad1470f75cb6c3fe26aa37
            git checkout FETCH_HEAD
            git apply ../sing-box/patches/utls/0001-utls-new-fingerprints.patch
          )

          # embed.go references this file, but the patch only edits .gitignore for it
          mkdir -p sing-box/common/adblock/adblockrust/resources/files
          touch sing-box/common/adblock/adblockrust/resources/files/placeholder.txt

      - name: Build Native Core & Assets
        run: |
          cd NekoBoxForAndroid
          bash buildScript/lib/assets.sh
          ./run lib core

      - name: Build Android APK
        run: |
          cd NekoBoxForAndroid
          chmod +x gradlew
          ./gradlew assembleOssDebug

      - name: Upload APK (arm64)
        uses: actions/upload-artifact@v6
        with:
          name: NekoBox-arm64-v8a
          path: NekoBoxForAndroid/app/build/outputs/apk/**/*arm64-v8a*.apk
          if-no-files-found: error

      - name: Upload APK (armv7)
        uses: actions/upload-artifact@v6
        with:
          name: NekoBox-armeabi-v7a
          path: NekoBoxForAndroid/app/build/outputs/apk/**/*armeabi-v7a*.apk
          if-no-files-found: error

      - name: Upload APK (universal)
        uses: actions/upload-artifact@v6
        with:
          name: NekoBox-universal
          path: NekoBoxForAndroid/app/build/outputs/apk/**/*universal*.apk
          if-no-files-found: error
